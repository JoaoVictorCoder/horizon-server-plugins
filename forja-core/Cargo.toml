[package]
name = "forja-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Forja's library: packs, items, custom blocks drawn as note block states, the resource pack and its HTTP server"

# The Forja plugin (../forja) is built on it; other plugins use it to build
